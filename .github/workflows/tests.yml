name: 无硬件测试

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装编译依赖和 kdl_parser
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates gnupg build-essential cmake \
            python3-venv python3-dev pkg-config \
            libeigen3-dev liborocos-kdl-dev liburdfdom-dev liburdfdom-headers-dev \
            libyaml-cpp-dev libglfw3-dev libgl1-mesa-dev \
            can-utils openssl
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ros-jazzy-kdl-parser ros-jazzy-ament-cmake ros-jazzy-ament-cmake-libraries

      - name: 安装 Python 依赖
        run: |
          set -eo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: 让 c++ 指向 g++
        run: |
          set -eo pipefail
          sudo update-alternatives --install /usr/bin/c++ c++ /usr/bin/g++ 100
          c++ --version

      - name: 编译离合测试
        run: |
          set -eo pipefail
          export CXX=g++
          export CMAKE_PREFIX_PATH=/opt/ros/jazzy
          export AMENT_PREFIX_PATH=/opt/ros/jazzy
          cmake -S . -B build -DPython3_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build -j"$(nproc)" --target human_mimic_clutch_test unitree_style_test teleop_gravity_test openarm_teaching_replay quest_cartesian_control

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
          CI: "true"
        run: |
          set -eo pipefail
          .venv/bin/python -m unittest discover -s tests -v
          node tests/test_quest_session.cjs
